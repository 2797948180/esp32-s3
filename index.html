<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="ESP32-S3 远程监控与控制平台：局域网直连与 MQTT 云端远程控制，支持全部安全 GPIO 与 PWM。">
<title>ESP32-S3 远程监控与控制平台</title>
<link rel="stylesheet" href="assets/css/app.css?v=20261121g">
</head>
<body>
<div class="layout">
  <!-- ============ 侧栏 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">S3</div>
      <div>
        <div class="kicker">REMOTE IOT PLATFORM</div>
        <div class="name">ESP32-S3 控制平台</div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-title">总览</div>
      <div class="nav-item" data-route="dashboard"><span class="ico">◎</span>首页</div>
      <div class="nav-item" data-route="monitor"><span class="ico">◍</span>设备监控</div>
    </div>

    <div class="nav-group">
      <div class="nav-title">设备</div>
      <div class="nav-item" data-route="devices"><span class="ico">▣</span>设备管理<span class="tag" id="navDeviceCount">0</span></div>
      <div class="nav-item" data-route="gpio"><span class="ico">⊞</span>GPIO 控制</div>
      <div class="nav-item" data-route="pwm"><span class="ico">∿</span>PWM 控制</div>
      <div class="nav-item" data-route="voltage"><span class="ico">⌁</span>电压检测</div>
    </div>

    <div class="nav-group">
      <div class="nav-title">工具与设置</div>
      <div class="nav-item" data-route="serial"><span class="ico">⌁</span>串口工具</div>
      <div class="nav-item" data-route="settings"><span class="ico">⚙</span>系统设置</div>
    </div>

    <div class="sidebar-foot">
      <div id="sidebarMode" class="row small"><i class="dot off"></i><span class="muted">未连接设备</span></div>
      <div class="small muted" style="margin-top:6px">本地优先 · 无强制云服务</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ============ 主区 ============ -->
  <div class="main">
    <header class="topbar">
      <button class="btn ghost sm mobile-only" id="menuBtn" aria-label="菜单">☰</button>
      <div>
        <h1 id="pageTitle">首页</h1>
        <div class="sub" id="pageSub">加载中…</div>
      </div>
      <div class="topbar-right">
        <select class="device-select" id="deviceSelect" aria-label="当前设备"></select>
        <div class="row" style="gap:6px">
          <i class="dot" id="globalDot"></i>
          <span class="small muted" id="globalStatus">未连接</span>
        </div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<!-- 移动端底部导航 -->
<nav class="bottombar">
  <div class="bb-item" data-route="dashboard"><span class="ico">◎</span>首页</div>
  <div class="bb-item" data-route="devices"><span class="ico">▣</span>设备</div>
  <div class="bb-item" data-route="gpio"><span class="ico">⊞</span>GPIO</div>
  <div class="bb-item" data-route="pwm"><span class="ico">∿</span>PWM</div>
  <div class="bb-item" data-route="voltage"><span class="ico">⌁</span>电压</div>
  <div class="bb-item" data-route="settings"><span class="ico">⚙</span>设置</div>
</nav>

<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>

<script src="assets/js/core/util.js?v=20261121g"></script>
<script src="assets/js/core/store.js?v=20261121g"></script>
<script src="assets/js/core/pinmap.js?v=20261121g"></script>
<script src="assets/js/transport/lan.js?v=20261121g"></script>
<script src="assets/js/transport/mqtt.js?v=20261121g"></script>
<script src="assets/js/transport/simulator.js?v=20261121g"></script>
<script src="assets/js/core/devices.js?v=20261121g"></script>
<script src="assets/js/ui/ui.js?v=20261121g"></script>
<script src="assets/js/serial.js?v=20261121g"></script>
<script src="assets/js/pages/dashboard.js?v=20261121g"></script>
<script src="assets/js/pages/devices.js?v=20261121g"></script>
<script src="assets/js/pages/gpio.js?v=20261121g"></script>
<script src="assets/js/pages/pwm.js?v=20261121g"></script>
<script src="assets/js/pages/monitor.js?v=20261121g"></script>
<script src="assets/js/pages/serial.js?v=20261121g"></script>
<script src="assets/js/pages/settings.js?v=20261121g"></script>
<script src="assets/js/pages/voltage.js?v=20261121g"></script>
<script src="assets/js/app.js?v=20261121g"></script>
</body>
</html>
